# ============================================================
# GitHub Actions Workflow: Build and Push Node.js App to ACR
# ============================================================
#
# Purpose:
#   - Triggered on code push to the "QA" branch
#   - Runs Pylint for Python code quality checks
#   - Builds a Docker image for a Node.js app
#   - Pushes the image to Azure Container Registry (ACR)
#
# Workflow Summary:
#   1. Trigger: Runs only when code is pushed to the QA branch
#   2. Environment: Executes on Ubuntu GitHub-hosted runner
#   3. Linting: Installs Python + Pylint and performs lint checks on `app/`
#   4. Containerization:
#        - Logs in to Azure Container Registry
#        - Builds Docker image with `docker/build-push-action`
#        - Tags image with Git SHA for immutability
#        - Pushes the image to ACR under repo: bob/<image-name>/<env>
#   5. Outputs: Prints confirmation and the pushed image digest
#
# Environment Variables:
#   ACR_NAME   = Name of Azure Container Registry (without .azurecr.io)
#   IMAGE_NAME = Name of the Docker image
#   NODE_ENV   = Deployment environment (QA here)
#
# Notes:
#   - Pylint step uses `|| true` to avoid failing pipeline on lint errors
#   - Secrets (ACR_USERNAME, ACR_PASSWORD) must be stored in GitHub repo secrets
#   - Image tag includes `github.sha` for uniqueness
#
# ============================================================

name: Build and Push Node.js App to ACR

on:
  push:
    branches:
      - QA

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      ACR_NAME: azracrftdmpcdev
      IMAGE_NAME: bobcat
      NODE_ENV: qa

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pylint
        run: pip install pylint

      - name: Run Pylint
        run: |
          echo "🔍 Running pylint..."
          pylint app/ || true

      - name: Log in to Azure ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/wfa/${{ env.IMAGE_NAME }}/${{ env.NODE_ENV }}:${{ github.sha }}

      - name: Image information
        run: |
          echo "✅ Image pushed successfully!"
          echo "Commit Image: ${{ env.ACR_NAME }}.azurecr.io/wfa/${{ env.IMAGE_NAME }}/${{ env.NODE_ENV }}:${{ github.sha }}"
